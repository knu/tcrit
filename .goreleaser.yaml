version: 2

builds:
  - id: tcrit
    main: ./cmd/tcrit/
    binary: tcrit
    ldflags:
      - -s -w -X github.com/knu/tcrit/internal/cli.version=v{{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: codex
    main: ./cmd/codex/
    binary: codex
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
