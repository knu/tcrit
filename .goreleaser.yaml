version: 2

builds:
  - main: ./cmd/tcrit/
    binary: tcrit
    ldflags:
      - -s -w -X github.com/knu/tcrit/internal/cli.version=v{{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
